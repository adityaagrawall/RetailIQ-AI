version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: retailiq_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retailiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailiq_secret}
      POSTGRES_DB: ${POSTGRES_DB:-retailiq_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retailiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retailiq_backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-retailiq}:${POSTGRES_PASSWORD:-retailiq_secret}@postgres:5432/${POSTGRES_DB:-retailiq_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-100}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ml_models:/app/ml_artifacts
      - upload_temp:/app/uploads_temp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retailiq_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  ml_models:
  upload_temp:
